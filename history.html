<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ประวัติโดเนท</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300&family=Noto+Sans+Thai:wght@300;400;500&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0a0208;--accent:#e8a4c8;--accent2:#c87eb0;--card:#12070f;--border:#2a1520;--text:#f0e8ec;--muted:#7a6070}
  *{box-sizing:border-box;margin:0;padding:0}
  body{min-height:100vh;background:var(--bg);font-family:'Noto Sans Thai',sans-serif;font-weight:300;color:var(--text);position:relative;overflow-x:hidden}
  .bg-layer{position:fixed;inset:0;background-size:cover;background-position:center;filter:brightness(0.15) saturate(0.5);z-index:0}
  .gate{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:24px;background:rgba(10,2,8,0.96);backdrop-filter:blur(8px)}
  .gate-card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:40px 32px;width:100%;max-width:320px;text-align:center}
  .gate-title{font-family:'Cormorant Garamond',serif;font-size:24px;font-weight:300;margin-bottom:6px}
  .gate-sub{font-size:12px;color:var(--muted);margin-bottom:28px;letter-spacing:0.05em}
  .gate input{width:100%;background:#06050a;border:1px solid var(--border);border-radius:8px;padding:11px 14px;color:var(--text);font-family:'Noto Sans Thai',sans-serif;font-size:14px;outline:none;transition:border-color 0.2s;margin-bottom:12px;text-align:center;letter-spacing:0.1em}
  .gate input:focus{border-color:var(--accent)}
  .gate-btn{width:100%;padding:11px;border:none;border-radius:8px;cursor:pointer;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#06050a;font-family:'Noto Sans Thai',sans-serif;font-size:14px;font-weight:500;transition:opacity 0.2s}
  .gate-btn:hover{opacity:0.88}
  .gate-err{margin-top:12px;font-size:13px;color:#f07070;display:none}
  .gate-back{display:inline-block;margin-top:16px;font-size:12px;color:var(--muted);text-decoration:none;transition:color 0.2s}
  .gate-back:hover{color:var(--accent)}
  .content{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:40px 16px 80px;display:none}
  .content.show{display:block}
  .back-link{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);text-decoration:none;letter-spacing:0.08em;text-transform:uppercase;margin-bottom:32px;transition:color 0.2s}
  .back-link:hover{color:var(--accent)}
  .page-title{font-family:'Cormorant Garamond',serif;font-size:32px;font-weight:300;margin-bottom:4px}
  .page-sub{font-size:13px;color:var(--muted);font-style:italic;font-family:'Cormorant Garamond',serif;margin-bottom:28px}
  .filter-row{display:flex;gap:8px;margin-bottom:16px}
  .filter-row input{flex:1;background:#080508;border:1px solid var(--border);border-radius:8px;padding:9px 12px;color:var(--text);font-family:'Noto Sans Thai',sans-serif;font-size:13px;outline:none;transition:border-color 0.2s}
  .filter-row input:focus{border-color:var(--accent)}
  .list-card{background:var(--card);border:1px solid var(--border);border-radius:16px;overflow:hidden;margin-bottom:20px}
  .list-header{padding:12px 20px;border-bottom:1px solid var(--border);font-size:11px;color:var(--muted);letter-spacing:0.08em;text-transform:uppercase;display:flex;justify-content:space-between;align-items:center}
  .total-badge{font-family:'DM Mono',monospace;font-size:12px;color:var(--accent)}
  .hist-row{display:flex;align-items:flex-start;gap:12px;padding:14px 20px;border-bottom:1px solid #1a0c12;transition:background 0.15s}
  .hist-row:last-child{border-bottom:none}
  .hist-row:hover{background:#1a0c12}
  .hist-date{font-family:'DM Mono',monospace;font-size:10px;color:var(--muted);width:52px;flex-shrink:0;padding-top:2px;line-height:1.5}
  .hist-info{flex:1;min-width:0}
  .hist-name{font-size:14px;color:var(--text);font-weight:400}
  .hist-msg{font-size:12px;color:var(--muted);margin-top:3px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .hist-amount{font-family:'DM Mono',monospace;font-size:15px;color:var(--accent);flex-shrink:0;padding-top:1px}
  .empty-state{text-align:center;padding:48px 20px;color:var(--muted);font-family:'Cormorant Garamond',serif;font-size:18px;font-style:italic}
  .pager{display:flex;gap:8px;justify-content:center;align-items:center}
  .pager button{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:8px 16px;color:var(--muted);font-family:'Noto Sans Thai',sans-serif;font-size:13px;cursor:pointer;transition:border-color 0.2s,color 0.2s}
  .pager button:hover{border-color:var(--accent);color:var(--accent)}
  .pager button:disabled{opacity:0.3;cursor:not-allowed}
  .pager-info{font-size:12px;color:var(--muted);font-family:'DM Mono',monospace}
  .nav-links{display:flex;justify-content:center;gap:20px;margin-top:28px;padding-top:20px;border-top:1px solid var(--border)}
  .nav-links a{font-size:11px;color:var(--muted);text-decoration:none;letter-spacing:0.08em;text-transform:uppercase;transition:color 0.2s}
  .nav-links a:hover{color:var(--accent)}
</style>
</head>
<body>
<div class="bg-layer" id="bgLayer"></div>

<!-- Login Gate -->
<div class="gate" id="gate">
  <div class="gate-card">
    <div style="font-size:32px;margin-bottom:12px">🔒</div>
    <div class="gate-title">ประวัติโดเนท</div>
    <div class="gate-sub">กรุณาใส่รหัสผ่านเพื่อดูข้อมูล</div>
    <input type="password" id="gatePwd" placeholder="••••••••" onkeydown="if(event.key==='Enter')unlock()">
    <button class="gate-btn" onclick="unlock()">เข้าดู</button>
    <div class="gate-err" id="gateErr">รหัสผ่านไม่ถูกต้อง</div>
    <a href="/" class="gate-back">← กลับหน้าหลัก</a>
  </div>
</div>

<!-- Main Content -->
<div class="content" id="mainContent">
  <a href="/" class="back-link">← กลับหน้าโดเนท</a>
  <div class="page-title">📜 ประวัติโดเนท</div>
  <div class="page-sub">บันทึกไว้ตลอดกาล ไม่มีวันหาย</div>

  <div class="filter-row">
    <input type="text" id="searchInput" placeholder="ค้นหาชื่อ..." oninput="filterRows()">
  </div>

  <div class="list-card">
    <div class="list-header">
      <span>✦ &nbsp;รายการทั้งหมด</span>
      <span class="total-badge" id="totalBadge">-</span>
    </div>
    <div id="listBody"><div class="empty-state" style="font-size:13px">กำลังโหลด...</div></div>
  </div>

  <div class="pager">
    <button id="prevBtn" onclick="changePage(-1)" disabled>← ก่อนหน้า</button>
    <span class="pager-info" id="pagerInfo">-</span>
    <button id="nextBtn" onclick="changePage(1)">ถัดไป →</button>
  </div>

  <div class="nav-links">
    <a href="/">💝 โดเนท</a>
    <a href="/top.html">🏆 Top Donors</a>
  </div>
</div>

<script>
let allData = [], filtered = [], page = 1;
const limit = 30;

function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;') }
function fmtDate(iso) {
  const d = new Date(iso);
  return String(d.getMonth()+1).padStart(2,'0') + '/' + String(d.getDate()).padStart(2,'0')
    + '\n' + String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
}

async function unlock() {
  const p = document.getElementById('gatePwd').value;
  if (!p) return;
  try {
    const res = await fetch('/api/admin/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: p })
    });
    const j = await res.json();
    if (j.ok) {
      document.getElementById('gate').style.display = 'none';
      document.getElementById('mainContent').classList.add('show');
      loadData();
    } else {
      const err = document.getElementById('gateErr');
      err.style.display = 'block';
      document.getElementById('gatePwd').value = '';
      setTimeout(() => err.style.display = 'none', 2000);
    }
  } catch(e) {
    console.error(e);
  }
}

async function loadData() {
  try {
    const [s, res] = await Promise.all([
      fetch('/api/settings').then(r => r.json()),
      fetch('/api/history?limit=9999').then(r => r.json())
    ]);
    // Apply theme
    document.documentElement.style.setProperty('--accent', s.accentColor || '#e8a4c8');
    document.documentElement.style.setProperty('--accent2', s.accentColor || '#c87eb0');
    if (s.bgUrl) document.getElementById('bgLayer').style.backgroundImage = `url(${s.bgUrl})`;

    allData = res.data || [];
    filtered = allData;
    render();
  } catch(e) {
    document.getElementById('listBody').innerHTML = '<div class="empty-state">เกิดข้อผิดพลาด</div>';
  }
}

function filterRows() {
  const q = document.getElementById('searchInput').value.toLowerCase().trim();
  filtered = q ? allData.filter(d => d.name.toLowerCase().includes(q) || (d.message||'').toLowerCase().includes(q)) : allData;
  page = 1;
  render();
}

function changePage(dir) {
  const max = Math.max(1, Math.ceil(filtered.length / limit));
  page = Math.min(Math.max(1, page + dir), max);
  render();
}

function render() {
  const max = Math.max(1, Math.ceil(filtered.length / limit));
  const start = (page - 1) * limit;
  const items = filtered.slice(start, start + limit);

  document.getElementById('pagerInfo').textContent = `${page} / ${max}`;
  document.getElementById('prevBtn').disabled = page <= 1;
  document.getElementById('nextBtn').disabled = page >= max;
  document.getElementById('totalBadge').textContent = filtered.length.toLocaleString() + ' รายการ';

  if (!items.length) {
    document.getElementById('listBody').innerHTML = '<div class="empty-state">ไม่พบรายการ</div>';
    return;
  }
  document.getElementById('listBody').innerHTML = items.map(d => `
    <div class="hist-row">
      <div class="hist-date">${fmtDate(d.date)}</div>
      <div class="hist-info">
        <div class="hist-name">${esc(d.name)}</div>
        ${d.message ? `<div class="hist-msg">${esc(d.message)}</div>` : ''}
      </div>
      <div class="hist-amount">฿${Number(d.amount).toLocaleString()}</div>
    </div>
  `).join('');
}

// โหลด bg ก่อนล็อกอิน
fetch('/api/settings').then(r => r.json()).then(s => {
  if (s.bgUrl) document.getElementById('bgLayer').style.backgroundImage = `url(${s.bgUrl})`;
  document.documentElement.style.setProperty('--accent', s.accentColor || '#e8a4c8');
}).catch(() => {});

document.getElementById('gatePwd').focus();
</script>
</body>
</html>
