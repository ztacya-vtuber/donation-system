<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>Goal Overlay</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --accent: #e8a4c8;
    --accent2: #c87eb0;
    --accent3: #f4d0e8;
    --glow: rgba(232,164,200,0.4);
    --bar-bg: rgba(0,0,0,0.55);
    --bar-fill-color: #e8a4c8;
    --bar-h: 50px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: transparent;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    position: relative;
  }
  .goal-wrap {
    position: absolute;
    bottom: 40px;
    left: 50%;
    transform: translateX(-50%) translateY(10px);
    width: 780px;
    opacity: 0;
    transition: opacity 0.7s ease, transform 0.7s cubic-bezier(0.2,0,0,1);
  }
  .goal-wrap.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .goal-label {
    text-align: center;
    margin-bottom: 8px;
    font-family: 'Noto Sans Thai', sans-serif;
    font-size: 26px;
    font-weight: 600;
    color: #fff;
    letter-spacing: 0.08em;
    text-shadow: 1px 1px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 0 0 8px #000;
  }
  .bar-row { display: flex; align-items: center; gap: 10px; }
  .side-num {
    font-family: 'DM Mono', monospace;
    font-size: 20px;
    font-weight: 500;
    color: #fff;
    white-space: nowrap;
    flex-shrink: 0;
    min-width: 36px;
    text-shadow: 1px 1px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 0 0 6px #000;
  }
  .side-num.right { text-align: right; }
  .bar-track {
    flex: 1;
    height: var(--bar-h);
    background: var(--bar-bg);
    border-radius: 99px;
    border: 1.5px solid rgba(255,255,255,0.12);
    overflow: hidden;
    position: relative;
  }
  .bar-fill {
    position: absolute;
    top: 0; left: 0; bottom: 0;
    width: 0%;
    border-radius: 99px;
    background: var(--bar-fill-color);
    transition: width 1.6s cubic-bezier(0.3,0,0.1,1);
    overflow: hidden;
  }
  .bar-fill::after {
    content: '';
    position: absolute;
    top: 0; bottom: 0; left: -60%;
    width: 50%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.25), transparent);
    animation: shimmer 2.6s ease infinite;
  }
  @keyframes shimmer { 0% { left: -60%; } 100% { left: 160%; } }
  .bar-fill.over {
    background: linear-gradient(90deg, var(--accent2), var(--accent), #ffd6ee, #fff5fa);
    box-shadow: 0 0 30px rgba(232,164,200,0.8);
  }
  .bar-text {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    z-index: 2;
    pointer-events: none;
  }
  .bar-cur {
    font-family: 'Noto Sans Thai', sans-serif;
    font-size: 22px;
    font-weight: 700;
    color: #fff;
    text-shadow: 1px 1px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 0 0 6px #000;
  }
  .bar-pct {
    font-family: 'DM Mono', monospace;
    font-size: 22px;
    font-weight: 500;
    color: #fff;
    text-shadow: 1px 1px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 0 0 6px #000;
  }
  .goal-countdown {
    text-align: center;
    margin-top: 7px;
    font-family: 'DM Mono', monospace;
    font-size: 20px;
    color: rgba(255,255,255,0.32);
    letter-spacing: 0.06em;
  }
  .particle {
    position: fixed; pointer-events: none; font-size: 16px;
    animation: floatUp 2.8s ease forwards; opacity: 0; z-index: 100;
  }
  @keyframes floatUp {
    0%   { opacity: 0; transform: translateY(0) scale(0.4) rotate(-10deg); }
    12%  { opacity: 1; }
    75%  { opacity: 0.7; }
    100% { opacity: 0; transform: translateY(-220px) scale(1.3) rotate(15deg); }
  }
</style>
</head>
<body>

<div class="goal-wrap" id="goalWrap">
  <div class="goal-label" id="goalLabel">เป้าหมาย</div>
  <div class="bar-row">
    <div class="side-num left">฿0</div>
    <div class="bar-track">
      <div class="bar-fill" id="barFill"></div>
      <div class="bar-text">
        <span class="bar-cur" id="barCur">฿0</span>
        <span class="bar-pct" id="barPct">(0%)</span>
      </div>
    </div>
    <div class="side-num right" id="sideMax">฿0</div>
  </div>
  <div class="goal-countdown" id="goalCountdown"></div>
</div>

<script>
const SUPABASE_URL  = '';
const SUPABASE_ANON = '';

let wasOver = false;

async function fetchJSON(path) {
  const r = await fetch(path);
  const ct = r.headers.get('content-type') || '';
  if (!r.ok || !ct.includes('application/json')) {
    const body = await r.text();
    throw new Error('non-JSON from ' + path + ' (' + r.status + '): ' + body.slice(0,80));
  }
  return r.json();
}

async function loadAndRender() {
  try {
    const s = await fetchJSON('/api/settings?t=' + Date.now());

    // accent color
    const accent     = s.accentColor || '#e8a4c8';
    const accentDark = shiftColor(accent, -30);
    const accentLight= shiftColor(accent,  30);
    document.documentElement.style.setProperty('--accent',  accent);
    document.documentElement.style.setProperty('--accent2', accentDark);
    document.documentElement.style.setProperty('--accent3', accentLight);
    document.documentElement.style.setProperty('--glow',    hexToRgba(accent, 0.4));

    // bar custom colors จาก admin
    const barBg       = s.goalBarBg   || 'rgba(0,0,0,0.55)';
    const barFillColor= s.goalBarFill || accent;
    document.documentElement.style.setProperty('--bar-bg',         barBg);
    document.documentElement.style.setProperty('--bar-fill-color', barFillColor);

    const goalAmount = Number(s.goalAmount) || 0;
    const goalMode   = s.goalMode  || 'total';
    const goalFrom   = s.goalFrom  || '';
    const goalTo     = s.goalTo    || '';
    const goalLabel  = s.goalLabel || 'เป้าหมาย';

    if (!goalAmount) {
      document.getElementById('goalWrap').classList.remove('show');
      return;
    }

    document.getElementById('goalLabel').textContent = goalLabel;
    document.getElementById('sideMax').textContent   = '฿' + goalAmount.toLocaleString();

    // countdown
    const cdEl = document.getElementById('goalCountdown');
    if (goalTo) {
      const end  = new Date(goalTo); end.setHours(23,59,59,999);
      const diff = end - new Date();
      if (diff <= 0) {
        cdEl.textContent = 'หมดเวลาแล้ว';
      } else {
        const d = Math.floor(diff / 86400000);
        const h = Math.floor((diff % 86400000) / 3600000);
        const m = Math.floor((diff % 3600000) / 60000);
        cdEl.textContent = d > 0 ? '⏳ ' + d + ' วัน ' + h + ' ชม.'
                         : h > 0 ? '⏳ ' + h + ' ชม. ' + m + ' นาที'
                         :         '⏳ ' + m + ' นาที';
      }
    } else {
      cdEl.textContent = goalMode === 'today' ? 'ยอดวันนี้' : '';
    }

    // fetch stats
    let statsPath = '/api/stats?t=' + Date.now();
    if (goalMode === 'range') {
      if (goalFrom) statsPath += '&from=' + goalFrom;
      if (goalTo)   statsPath += '&to='   + goalTo;
    }
    const st = await fetchJSON(statsPath);

    const cur = goalMode === 'today' ? Number(st.todayAmount  || 0)
              : goalMode === 'range' ? Number(st.rangeAmount  || 0)
              :                        Number(st.totalAmount  || 0);

    const pct = goalAmount > 0 ? (cur / goalAmount) * 100 : 0;

    document.getElementById('barCur').textContent = '฿' + cur.toLocaleString();
    document.getElementById('barPct').textContent = '(' + pct.toFixed(1) + '%)';

    const fill = document.getElementById('barFill');
    fill.style.width = Math.min(100, pct) + '%';

    if (pct >= 100) {
      fill.classList.add('over');
      if (!wasOver) celebrate();
      wasOver = true;
    } else {
      fill.classList.remove('over');
      wasOver = false;
    }

    document.getElementById('goalWrap').classList.add('show');

  } catch(e) {
    console.warn('[goal-overlay]', e);
  }
}

function celebrate() {
  const syms = ['✨','🌸','💖','🎉','⭐','💕','🌟','🎊','💫'];
  for (let i = 0; i < 24; i++) {
    setTimeout(() => {
      const p = document.createElement('div');
      p.className = 'particle';
      p.textContent = syms[Math.floor(Math.random() * syms.length)];
      p.style.cssText = 'left:' + (10 + Math.random()*80) + '%;bottom:60px;'
        + 'animation-delay:' + (Math.random()*0.6) + 's;'
        + 'font-size:' + (13 + Math.random()*9) + 'px';
      document.body.appendChild(p);
      setTimeout(() => p.remove(), 3200);
    }, i * 80);
  }
}

function hexToRgba(hex, a) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return 'rgba('+r+','+g+','+b+','+a+')';
}
function shiftColor(hex, n) {
  const c = v => Math.min(255,Math.max(0,v));
  const r = c(parseInt(hex.slice(1,3),16)+n);
  const g = c(parseInt(hex.slice(3,5),16)+Math.round(n*0.7));
  const b = c(parseInt(hex.slice(5,7),16)+n);
  return '#'+[r,g,b].map(x=>x.toString(16).padStart(2,'0')).join('');
}

function connectRealtime() {
  if (!SUPABASE_URL) return;
  const s = document.createElement('script');
  s.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js';
  s.onload = () => {
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON);
    sb.channel('donations')
      .on('broadcast', { event: 'new_donation' }, () => setTimeout(loadAndRender, 1000))
      .subscribe();
  };
  document.head.appendChild(s);
}

loadAndRender();
connectRealtime();
setInterval(loadAndRender, 5000);
</script>
</body>
</html>
