<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>Top 5 Overlay</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Noto+Sans+Thai:wght@300;400;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{--accent:#e8a4c8;--accent2:#c87eb0;--glow:rgba(232,164,200,0.4)}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:transparent;width:1920px;height:1080px;overflow:hidden;position:relative;}

  #panel{
    position:absolute;left:40px;bottom:40px;width:460px;
    background:rgba(10,2,8,0.72);
    border:1px solid rgba(232,164,200,0.25);
    border-radius:18px;
    padding:18px 20px 10px;
    box-shadow:0 10px 40px rgba(0,0,0,0.5);
    backdrop-filter:blur(6px);
    opacity:0;transform:translateY(14px);
    transition:opacity .5s ease, transform .5s cubic-bezier(0.2,0,0,1);
  }
  #panel.show{opacity:1;transform:translateY(0);}

  #panelTitle{
    font-family:'Noto Sans Thai',sans-serif;font-size:14px;font-weight:700;
    letter-spacing:0.14em;text-transform:uppercase;color:var(--accent);
    text-shadow:0 2px 14px rgba(0,0,0,0.7);margin-bottom:12px;
    display:flex;align-items:center;gap:8px;
  }

  .row{
    display:flex;align-items:center;gap:12px;padding:9px 0;
    border-bottom:1px solid rgba(255,255,255,0.06);
    transition:background .3s ease;
  }
  .row:last-child{border-bottom:none;}
  .row.pulse{background:rgba(232,164,200,0.12);border-radius:8px;}

  .rank{
    font-family:'DM Mono',monospace;font-size:15px;font-weight:500;
    width:26px;flex-shrink:0;text-align:center;color:var(--muted,#b98a9b);
    text-shadow:0 2px 10px rgba(0,0,0,0.7);
  }
  .row:nth-child(1) .rank{color:#d4af37;font-size:19px;}
  .row:nth-child(2) .rank{color:#c9ccd1;font-size:17px;}
  .row:nth-child(3) .rank{color:#cd7f32;font-size:17px;}

  .name{
    flex:1;min-width:0;font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:600;color:#fff;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    text-shadow:0 2px 16px rgba(0,0,0,0.8);
  }
  .amt{
    font-family:'DM Mono',monospace;font-size:17px;font-weight:500;color:var(--accent);
    flex-shrink:0;text-shadow:0 2px 16px rgba(0,0,0,0.7);
    filter:drop-shadow(0 0 10px var(--glow));
  }

  .empty{padding:14px 0;font-family:'Noto Sans Thai',sans-serif;font-size:13px;color:rgba(255,255,255,0.4);text-align:center;}

  #dot{position:fixed;bottom:12px;right:12px;width:8px;height:8px;border-radius:50%;background:#444;z-index:999;transition:background .3s}
  #testBtn{position:fixed;bottom:12px;right:26px;padding:6px 14px;border:1px solid rgba(232,164,200,0.3);border-radius:8px;background:rgba(10,2,8,0.8);color:rgba(232,164,200,0.7);font-size:11px;cursor:pointer;font-family:'DM Mono',monospace;z-index:999;}
  #testBtn:hover{border-color:var(--accent);color:var(--accent)}
</style>
</head>
<body>

<div id="panel">
  <div id="panelTitle">🏆 Top 5 Donors</div>
  <div id="list"></div>
</div>

<div id="dot" title="realtime status"></div>
<button id="testBtn" onclick="testRefresh()">⟳ Test</button>

<script>
const SUPABASE_URL  = 'https://idmnppkltddrfxwhvnwa.supabase.co';
const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlkbW5wcGtsdGRkcmZ4d2h2bndhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAyMTI2ODQsImV4cCI6MjA5NTc4ODY4NH0.p5JYw0boVmoKLACbLcRwK3FeO9yLZi1HSd7N_1c5Lu0';

let lastSignature = '';

async function init(){
  try{
    const s = await fetch('/api/settings').then(r=>r.json());
    document.documentElement.style.setProperty('--accent', s.accentColor || '#e8a4c8');
    document.documentElement.style.setProperty('--accent2', (s.accentColor||'#e8a4c8')+'cc');
    document.documentElement.style.setProperty('--glow', hexToRgba(s.accentColor||'#e8a4c8', 0.4));
  }catch(e){}
  await loadTop5();
  connectRealtime();
}

function hexToRgba(hex,a){
  const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${a})`;
}

async function loadTop5(){
  try{
    const top = await fetch('/api/top?t='+Date.now()).then(r=>r.json());
    const list = (top||[]).slice(0,5);
    const signature = JSON.stringify(list.map(d=>d.name+':'+d.total));
    const changed = signature !== lastSignature;
    lastSignature = signature;
    renderList(list, changed);
  }catch(e){console.warn('[top5] loadTop5',e);}
}

function renderList(list, pulse){
  const el = document.getElementById('list');
  if(!list.length){
    el.innerHTML = '<div class="empty">ยังไม่มีข้อมูลโดเนท</div>';
  }else{
    el.innerHTML = list.map((d,i)=>`
      <div class="row${pulse?' pulse':''}">
        <div class="rank">#${i+1}</div>
        <div class="name">${esc(d.name)}</div>
        <div class="amt">฿${Number(d.total).toLocaleString()}</div>
      </div>
    `).join('');
    if(pulse) setTimeout(()=>{
      document.querySelectorAll('.row.pulse').forEach(r=>r.classList.remove('pulse'));
    }, 1600);
  }
  document.getElementById('panel').classList.add('show');
}

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

function connectRealtime(){
  const script=document.createElement('script');
  script.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js';
  script.onload=()=>{
    const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON);
    sb.channel('donations')
      .on('broadcast',{event:'new_donation'},()=>{
        console.log('[top5] new donation → refreshing list');
        setTimeout(loadTop5, 1200); // give the server a beat to update totals
      })
      .on('broadcast',{event:'settings_update'},({payload})=>{
        if(payload.accentColor){
          document.documentElement.style.setProperty('--accent',payload.accentColor);
          document.documentElement.style.setProperty('--glow',hexToRgba(payload.accentColor,0.4));
        }
      })
      .subscribe(status=>{
        console.log('[top5] status:',status);
        document.getElementById('dot').style.background = status==='SUBSCRIBED' ? 'var(--accent)' : '#444';
      });
  };
  document.head.appendChild(script);
}

function testRefresh(){
  lastSignature=''; // force pulse
  loadTop5();
}

// periodic safety-net refresh in case a broadcast is missed
setInterval(loadTop5, 15000);
init();
</script>
</body>
</html>
