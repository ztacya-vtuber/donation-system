<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Donate</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Sarabun', sans-serif;
      background: #0f0f0f;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px;
    }
    .card {
      background: #1a1a1a;
      border-radius: 16px;
      padding: 28px 24px;
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    h1 { text-align: center; font-size: 1.4rem; color: #e0aaff; }
    .qr-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    .qr-wrap img {
      width: 220px;
      height: 220px;
      border-radius: 12px;
      background: #fff;
      padding: 8px;
    }
    .qr-label { font-size: 0.85rem; color: #aaa; }
    label { font-size: 0.9rem; color: #ccc; display: block; margin-bottom: 4px; }
    input, textarea {
      width: 100%;
      background: #2a2a2a;
      border: 1px solid #333;
      border-radius: 8px;
      color: #fff;
      padding: 10px 12px;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus, textarea:focus { border-color: #e0aaff; }
    textarea { resize: vertical; min-height: 72px; }
    .amount-wrap { position: relative; }
    .amount-wrap input { padding-right: 40px; }
    .amount-unit {
      position: absolute; right: 12px; top: 50%;
      transform: translateY(-50%);
      color: #888; font-size: 0.9rem;
    }
    button {
      background: #e0aaff;
      color: #000;
      border: none;
      border-radius: 10px;
      padding: 13px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .status { text-align: center; font-size: 0.95rem; min-height: 24px; }
    .status.success { color: #a0f0a0; }
    .status.error { color: #f0a0a0; }
    a.top-link {
      color: #e0aaff; font-size: 0.85rem;
      text-decoration: none; text-align: center;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>💜 Donate</h1>

    <div class="qr-wrap">
      <img src="/qr.png" alt="QR Code ถุงเงิน" />
      <span class="qr-label">สแกน QR แล้วโอนตามใจชอบ ♡</span>
    </div>

    <div>
      <label>ชื่อที่จะขึ้นจอ *</label>
      <input id="name" type="text" placeholder="ชื่อเล่นของคุณ" maxlength="50" />
    </div>

    <div>
      <label>ข้อความ (ไม่บังคับ)</label>
      <textarea id="message" placeholder="ฝากข้อความถึง streamer..."></textarea>
    </div>

    <div>
      <label>จำนวนเงินที่โอน *</label>
      <div class="amount-wrap">
        <input id="amount" type="number" placeholder="0" min="1" max="99999" />
        <span class="amount-unit">฿</span>
      </div>
    </div>

    <button id="submitBtn" onclick="submitDonation()">ส่ง ✓</button>
    <div class="status" id="status"></div>
    <a class="top-link" href="/top.html">🏆 Top Donors</a>
  </div>

  <script>
    async function submitDonation() {
      const name = document.getElementById('name').value.trim();
      const message = document.getElementById('message').value.trim();
      const amount = parseFloat(document.getElementById('amount').value);
      const status = document.getElementById('status');
      const btn = document.getElementById('submitBtn');

      if (!name) { showStatus('กรุณากรอกชื่อ', 'error'); return; }
      if (!amount || amount <= 0) { showStatus('กรุณากรอกจำนวนเงิน', 'error'); return; }

      btn.disabled = true;
      showStatus('กำลังส่ง...', '');

      try {
        const res = await fetch('/api/donate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ display_name: name, message, amount })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'เกิดข้อผิดพลาด');

        showStatus('ส่งข้อมูลสำเร็จแล้ว ขอบคุณนะคะ 💜', 'success');
        document.getElementById('name').value = '';
        document.getElementById('message').value = '';
        document.getElementById('amount').value = '';
      } catch (err) {
        showStatus(err.message, 'error');
      } finally {
        btn.disabled = false;
      }
    }

    function showStatus(msg, type) {
      const el = document.getElementById('status');
      el.textContent = msg;
      el.className = 'status ' + type;
    }
  </script>
</body>
</html>
