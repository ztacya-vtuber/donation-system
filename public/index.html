<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Donate</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600&family=Cormorant+Garamond:ital,wght@0,400;1,300&display=swap" rel="stylesheet"/>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;}
    :root{--page-bg:#0d0508;--accent:#c06080;--bg-image:#0d0508;}
    body{font-family:'Sarabun',sans-serif;background:var(--page-bg);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding-bottom:40px;transition:background 0.3s;position:relative;overflow-x:hidden;}
    body::before{content:'';position:fixed;inset:-28px;z-index:-3;background:var(--bg-image) center / cover fixed;filter:blur(2px) saturate(1.18) brightness(0.72);transform:scale(1.05);}
    body::after{content:'';position:fixed;inset:0;z-index:-2;pointer-events:none;background:radial-gradient(circle at 50% 16%, rgba(228,185,208,0.18), transparent 34%),radial-gradient(circle at 18% 78%, rgba(154,64,96,0.18), transparent 30%),linear-gradient(180deg, rgba(13,5,8,0.42), rgba(13,5,8,0.9)),repeating-linear-gradient(0deg, rgba(255,255,255,0.018) 0px, rgba(255,255,255,0.018) 1px, transparent 1px, transparent 4px);}
    .banner{width:100%;max-width:520px;height:200px;position:relative;overflow:hidden;background:#1a0a0e;box-shadow:0 20px 70px rgba(0,0,0,0.28);}
    .banner img{width:100%;height:100%;object-fit:cover;opacity:0.72;transition:opacity 0.3s;}
    .banner::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg, transparent 28%, var(--page-bg)),linear-gradient(90deg, rgba(13,5,8,0.35), transparent 35%, rgba(13,5,8,0.28));}
    .profile{width:100%;max-width:520px;display:flex;align-items:center;gap:14px;padding:0 20px 16px;margin-top:-36px;position:relative;z-index:2;}
    .avatar{width:68px;height:68px;border-radius:50%;border:2px solid var(--accent);object-fit:cover;background:#2a1020;flex-shrink:0;box-shadow:0 8px 30px rgba(0,0,0,0.38);}
    .streamer-name{font-family:'Cormorant Garamond',serif;font-size:22px;color:#f0d0d8;font-weight:400;text-shadow:0 2px 18px rgba(0,0,0,0.55);}
    .streamer-sub{font-size:13px;color:#b98a9b;font-style:italic;text-shadow:0 2px 14px rgba(0,0,0,0.55);}
    .card{width:calc(100% - 32px);max-width:520px;background:rgba(21,8,16,0.82);border:1px solid rgba(228,185,208,0.16);border-radius:16px;padding:24px 20px 28px;margin:0 16px;box-shadow:0 24px 80px rgba(0,0,0,0.34);backdrop-filter:blur(10px);}
    .dots{display:flex;gap:6px;justify-content:center;margin-bottom:20px;}
    .dot{width:6px;height:6px;border-radius:50%;background:#2a1020;border:1px solid #3a1a22;transition:background 0.3s;}
    .dot.active{background:var(--accent);border-color:var(--accent);}
    .dot.done{background:#4a2030;border-color:#4a2030;}
    .page{display:none;flex-direction:column;gap:16px;}
    .page.active{display:flex;}
    .qr-wrap{display:flex;flex-direction:column;align-items:center;gap:10px;padding:12px 0 4px;}
    .qr-wrap img{width:200px;height:200px;border-radius:12px;background:#fff;padding:8px;object-fit:contain;box-shadow:0 18px 60px rgba(0,0,0,0.34);}
    .qr-label{font-size:13px;color:#b98a9b;text-align:center;}
    .section-title{font-size:13px;color:#d9a8bc;letter-spacing:2px;text-transform:uppercase;font-weight:300;}
    .field label{font-size:12px;color:#b98a9b;display:block;margin-bottom:5px;}
    .field input,.field textarea{width:100%;background:rgba(13,5,8,0.86);border:1px solid rgba(228,185,208,0.16);border-radius:8px;color:#e0c0c8;padding:10px 12px;font-size:15px;font-family:'Sarabun',sans-serif;outline:none;transition:border-color 0.2s,background 0.2s;}
    .field input:focus,.field textarea:focus{border-color:var(--accent);background:rgba(13,5,8,0.96);}
    .field textarea{resize:vertical;min-height:72px;}
    .amount-wrap{position:relative;}
    .amount-wrap input{padding-right:36px;}
    .amount-unit{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:#b98a9b;font-size:13px;}
    .btn{background:linear-gradient(90deg,var(--accent),#9a4060);border:none;border-radius:10px;color:#fff;font-family:'Sarabun',sans-serif;font-size:15px;padding:13px;cursor:pointer;transition:opacity 0.2s;letter-spacing:0.5px;box-shadow:0 12px 34px rgba(154,64,96,0.28);}
    .btn:disabled{opacity:0.5;cursor:not-allowed;}
    .btn-ghost{background:rgba(13,5,8,0.34);border:1px solid rgba(228,185,208,0.16);border-radius:10px;color:#b98a9b;font-family:'Sarabun',sans-serif;font-size:14px;padding:10px;cursor:pointer;}
    .btn-random{background:rgba(228,185,208,0.12);border:1px solid rgba(228,185,208,0.3);border-radius:10px;color:#e0c0c8;font-family:'Sarabun',sans-serif;font-size:13px;padding:9px;cursor:pointer;width:100%;margin-top:2px;}
    .btn-random:hover{border-color:var(--accent);color:var(--accent);}
    .pending-box{display:flex;flex-direction:column;align-items:center;gap:12px;padding:24px 0 16px;text-align:center;}
    .pending-symbol{font-size:36px;color:var(--accent);}
    .pending-title{font-family:'Cormorant Garamond',serif;font-size:22px;color:#f0d0d8;}
    .pending-sub{font-size:13px;color:#b98a9b;line-height:1.7;}
    .status{font-size:13px;min-height:18px;text-align:center;}
    .status.error{color:#f08080;}

    /* ── Sound picker ── */
    #soundPicker{display:none;flex-direction:column;gap:8px;}
    #soundPicker .field label{margin-bottom:8px;}
    .sound-hint{font-size:11px;color:var(--accent);margin-bottom:2px;}
    .sound-opt{display:flex;align-items:center;gap:10px;background:rgba(13,5,8,0.6);border:1px solid rgba(228,185,208,0.14);border-radius:10px;padding:9px 12px;cursor:pointer;transition:border-color .2s,background .2s;}
    .sound-opt:hover{border-color:rgba(228,185,208,0.3);}
    .sound-opt.selected{border-color:var(--accent);background:rgba(192,96,128,0.16);}
    .sound-opt input[type=radio]{width:auto;flex:0 0 auto;accent-color:var(--accent);}
    .sound-opt-name{flex:1;font-size:14px;color:#e0c0c8;}
    .sound-opt-play{flex:0 0 auto;background:rgba(228,185,208,0.14);border:none;border-radius:50%;width:30px;height:30px;color:#e0c0c8;font-size:12px;cursor:pointer;}
    .sound-opt-play:hover{background:var(--accent);color:#1a0510;}

    /* ── Meme/image picker ── */
    #memePicker{display:none;flex-direction:column;gap:8px;}
    #memePicker .field label{margin-bottom:8px;}
    .meme-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
    .meme-opt{position:relative;border-radius:10px;overflow:hidden;border:2px solid rgba(228,185,208,0.14);cursor:pointer;aspect-ratio:1;background:rgba(13,5,8,0.6);transition:border-color .2s;}
    .meme-opt.selected{border-color:var(--accent);box-shadow:0 0 0 2px rgba(192,96,128,0.3);}
    .meme-opt img{width:100%;height:100%;object-fit:cover;display:block;}
    .meme-opt-none{display:flex;align-items:center;justify-content:center;font-size:11px;color:#b98a9b;text-align:center;padding:4px;}

    .footer{margin-top:20px;text-align:center;}
    .footer a{color:#7a4354;font-size:12px;text-decoration:none;letter-spacing:1px;}
    .ornament{color:#5f2d3e;font-size:11px;text-align:center;margin-top:12px;}

    /* ── Goal Bar ── */
    #goalSection{display:none;width:calc(100% - 32px);max-width:520px;margin:14px 16px 0;}
    .goal-card{background:rgba(21,8,16,0.75);border:1px solid rgba(228,185,208,0.14);border-radius:14px;padding:16px 18px 14px;backdrop-filter:blur(10px);}
    .goal-header{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;}
    .goal-name{font-family:'Cormorant Garamond',serif;font-size:17px;color:#f0d0d8;}
    .goal-nums{font-family:monospace;font-size:13px;color:var(--accent);}
    .bar-track{width:100%;height:10px;background:rgba(255,255,255,0.07);border-radius:99px;border:1px solid rgba(228,185,208,0.15);overflow:hidden;}
    .bar-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,#c87eb0,var(--accent));width:0%;transition:width 1.2s cubic-bezier(0.4,0,0.2,1);box-shadow:0 0 12px rgba(232,164,200,0.4);}
    .bar-fill.complete{background:linear-gradient(90deg,#5abf80,#86d6a3);box-shadow:0 0 16px rgba(134,214,163,0.5);animation:gpulse 1.5s ease infinite alternate;}
    @keyframes gpulse{from{box-shadow:0 0 10px rgba(134,214,163,0.4)}to{box-shadow:0 0 24px rgba(134,214,163,0.8)}}
    .goal-pct{font-size:11px;color:#7a4a5a;text-align:center;margin-top:6px;font-family:monospace;}
  </style>
</head>
<body>

  <div class="banner"><img id="bannerImg" src="" alt="banner"/></div>

  <div class="profile">
    <img id="avatarImg" class="avatar" src="" alt="avatar"/>
    <div>
      <div id="streamerName" class="streamer-name">&#8203;</div>
      <div id="streamerSub" class="streamer-sub">At this very hour, you are most welcome.</div>
    </div>
  </div>

  <div class="card">
    <div class="dots">
      <div class="dot active" id="d0"></div>
      <div class="dot" id="d1"></div>
      <div class="dot" id="d2"></div>
    </div>

    <div class="page active" id="page1">
      <div class="qr-wrap">
        <img id="qrImg" src="" alt="QR"/>
        <div class="qr-label">สแกน QR แล้วโอนเงินตามใจชอบ ♡</div>
      </div>
      <button class="btn" onclick="goTo(2)">โอนแล้ว → กรอกข้อมูล</button>
    </div>

    <div class="page" id="page2">
      <div class="section-title">โดเนท</div>
      <div class="field">
        <label>ชื่อที่จะขึ้นจอ *</label>
        <input id="name" type="text" placeholder="ชื่อของคุณ" maxlength="50"/>
      </div>
      <div class="field">
        <label>ข้อความ (ไม่บังคับ)</label>
        <textarea id="message" placeholder="ข้อความถึง streamer..."></textarea>
      </div>
      <div class="field">
        <label>จำนวนเงินที่โอน *</label>
        <div class="amount-wrap">
          <input id="amount" type="number" placeholder="0" min="1" max="99999" oninput="updatePickers()"/>
          <span class="amount-unit">฿</span>
        </div>
      </div>
      <div class="field" id="soundPicker">
        <label><span id="soundPickerLabel">เลือกเสียงตอนแสดงผล (ไม่บังคับ)</span></label>
        <div id="soundOptList"></div>
      </div>
      <div class="field" id="memePicker">
        <label><span id="memePickerLabel">เลือกรูป/มีมตอนแสดงผล (ไม่บังคับ)</span></label>
        <div class="meme-grid" id="memeOptList"></div>
      </div>
      <button type="button" class="btn-random" id="randomBtn" style="display:none" onclick="randomizePicks()">🎲 สุ่มให้หน่อย</button>
      <div class="status error" id="formStatus"></div>
      <button class="btn" id="submitBtn" onclick="submitDonation()">ยืนยัน ✓</button>
      <button class="btn-ghost" onclick="goTo(1)">← กลับ</button>
    </div>

    <div class="page" id="page3">
      <div class="pending-box">
        <div class="pending-symbol">♡</div>
        <div class="pending-title">ขอบคุณนะคะ</div>
        <div class="pending-sub">
          ข้อมูลของคุณถูกบันทึกเรียบร้อยแล้ว<br/>
          กำลังรอ streamer ตรวจสอบและอนุมัติ ♡
        </div>
      </div>
      <button class="btn-ghost" onclick="resetAll()">โดเนทอีกครั้ง</button>
    </div>

    <div class="ornament">✦</div>
  </div>

  <!-- Goal Bar -->
  <div id="goalSection">
    <div class="goal-card">
      <div class="goal-header">
        <div class="goal-name" id="goalLabelEl">🎯 เป้าหมาย</div>
        <div class="goal-nums"><span id="goalCur">฿0</span> / <span id="goalTarget">฿0</span></div>
      </div>
      <div class="bar-track">
        <div class="bar-fill" id="goalBar"></div>
      </div>
      <div class="goal-pct" id="goalPct">0%</div>
      <div id="goalCountdown" style="font-size:11px;color:#b98a9b;text-align:center;margin-top:3px;font-family:monospace;"></div>
    </div>
  </div>

  <div class="footer" style="margin-top:16px">
    <a href="/top.html">🏆 TOP DONORS</a>
  </div>

  <audio id="soundPreviewPlayer" preload="none"></audio>

  <script>
    let goalAmount = 0, goalMode = 'total', goalFrom = '', goalTo = '';
    let soundOptions = [], memeOptions = [], presetMinAmount = 10;
    let selectedSoundId = null, selectedMemeId = null;

    fetch('/api/settings?t='+Date.now(),{cache:'no-store'})
      .then(r=>r.json())
      .then(s=>{
        soundOptions = Array.isArray(s.soundOptions) ? s.soundOptions : [];
        memeOptions = Array.isArray(s.memeOptions) ? s.memeOptions : [];
        // เดิมชื่อ soundMinAmount ใช้เป็น threshold รวมสำหรับทั้งเสียงและมีม
        presetMinAmount = Number(s.soundMinAmount ?? 10);
        if(s.name) document.getElementById('streamerName').textContent=s.name;
        if(s.greeting) document.getElementById('streamerSub').textContent=s.greeting;
        if(s.accentColor) document.documentElement.style.setProperty('--accent',s.accentColor);
        if(s.bgColor){document.documentElement.style.setProperty('--page-bg',s.bgColor);document.documentElement.style.setProperty('--bg-image',s.bgColor);document.body.style.background=s.bgColor;}
        if(s.bgUrl) document.documentElement.style.setProperty('--bg-image',`url("${s.bgUrl}")`);
        if(s.bannerUrl){document.getElementById('bannerImg').src=s.bannerUrl;document.getElementById('bannerImg').style.opacity='0.72';}
        if(s.avatarUrl){document.getElementById('avatarImg').src=s.avatarUrl;document.getElementById('avatarImg').style.opacity='1';}
        if(s.qrUrl){document.getElementById('qrImg').src=s.qrUrl;document.getElementById('qrImg').style.opacity='1';}

        // Goal bar
        if(s.goalAmount && Number(s.goalAmount) > 0){
          goalAmount = Number(s.goalAmount);
          goalMode   = s.goalMode || 'total';
          document.getElementById('goalLabelEl').textContent = '🎯 ' + (s.goalLabel || 'เป้าหมาย');
          goalFrom = s.goalFrom||'';
          goalTo   = s.goalTo||'';
          document.getElementById('goalTarget').textContent = '฿' + goalAmount.toLocaleString();
          document.getElementById('goalSection').style.display = 'block';
          loadGoalStats();
        }
      })
      .catch(e=>console.error('[settings]',e));

    function loadGoalStats(){
      let url='/api/stats?t='+Date.now();
      if(goalMode==='range'&&goalFrom) url+='&from='+goalFrom;
      if(goalMode==='range'&&goalTo)   url+='&to='+goalTo;
      fetch(url).then(r=>r.json()).then(st=>{
        let cur=0;
        if(goalMode==='today') cur=Number(st.todayAmount||0);
        else if(goalMode==='range') cur=Number(st.rangeAmount||0);
        else cur=Number(st.totalAmount||0);
        const pct = goalAmount>0 ? (cur/goalAmount)*100 : 0;
        const pctDisplay = pct>100 ? pct.toFixed(0)+'%' : pct.toFixed(1)+'%';
        document.getElementById('goalCur').textContent='฿'+cur.toLocaleString();
        document.getElementById('goalPct').textContent=pctDisplay;
        const bar=document.getElementById('goalBar');
        bar.style.width=Math.min(100,pct)+'%';
        if(pct>=100) bar.classList.add('complete');
        else bar.classList.remove('complete');
        if(goalTo){
          const end=new Date(goalTo);end.setHours(23,59,59,999);
          const now=new Date();
          const diff=end-now;
          const cdEl=document.getElementById('goalCountdown');
          if(cdEl){
            if(diff<=0){cdEl.textContent='หมดเวลาแล้ว';}
            else{
              const days=Math.floor(diff/86400000);
              const hrs=Math.floor((diff%86400000)/3600000);
              const mins=Math.floor((diff%3600000)/60000);
              cdEl.textContent=days>0?days+' วัน '+hrs+' ชม.':hrs>0?hrs+' ชม. '+mins+' นาที':mins+' นาที';
            }
          }
        }
      }).catch(()=>{});
    }

    function updatePickers(){
      const amount = parseFloat(document.getElementById('amount').value) || 0;
      const soundPicker = document.getElementById('soundPicker');
      const memePicker = document.getElementById('memePicker');
      const randomBtn = document.getElementById('randomBtn');
      const eligible = amount >= presetMinAmount;

      soundPicker.style.display = (eligible && soundOptions.length) ? 'flex' : 'none';
      memePicker.style.display = (eligible && memeOptions.length) ? 'flex' : 'none';
      randomBtn.style.display = (eligible && (soundOptions.length || memeOptions.length)) ? 'block' : 'none';

      if(eligible){
        renderSoundOptions();
        renderMemeOptions();
      }
    }

    function renderSoundOptions(){
      const el = document.getElementById('soundOptList');
      el.innerHTML = `<div class="sound-opt${selectedSoundId===null?' selected':''}" onclick="selectSound(null)">
          <input type="radio" name="soundOpt" ${selectedSoundId===null?'checked':''} onclick="selectSound(null)">
          <div class="sound-opt-name">ไม่เลือก (ใช้เสียงปกติของ streamer)</div>
        </div>` +
        soundOptions.map(s => `
        <div class="sound-opt${selectedSoundId===s.id?' selected':''}" onclick="selectSound('${s.id}')">
          <input type="radio" name="soundOpt" ${selectedSoundId===s.id?'checked':''} onclick="selectSound('${s.id}')">
          <div class="sound-opt-name">${esc(s.name)}</div>
          <button type="button" class="sound-opt-play" onclick="event.stopPropagation();previewSelectedSound('${s.url}')">▶</button>
        </div>`).join('');
    }

    function renderMemeOptions(){
      const el = document.getElementById('memeOptList');
      el.innerHTML = `<div class="meme-opt meme-opt-none${selectedMemeId===null?' selected':''}" onclick="selectMeme(null)">ไม่เลือก</div>` +
        memeOptions.map(m => `
        <div class="meme-opt${selectedMemeId===m.id?' selected':''}" onclick="selectMeme('${m.id}')">
          <img src="${m.url}" alt="${esc(m.name||'')}" loading="lazy"/>
        </div>`).join('');
    }

    function selectSound(id){ selectedSoundId = id; renderSoundOptions(); }
    function selectMeme(id){ selectedMemeId = id; renderMemeOptions(); }

    function randomizePicks(){
      if(soundOptions.length){
        selectedSoundId = soundOptions[Math.floor(Math.random()*soundOptions.length)].id;
      }
      if(memeOptions.length){
        selectedMemeId = memeOptions[Math.floor(Math.random()*memeOptions.length)].id;
      }
      renderSoundOptions();
      renderMemeOptions();
    }

    function previewSelectedSound(url){
      const p = document.getElementById('soundPreviewPlayer');
      p.src = url; p.currentTime = 0; p.play().catch(()=>{});
    }

    function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

    function goTo(n){
      [1,2,3].forEach(i=>document.getElementById('page'+i).classList.toggle('active',i===n));
      const states=n===1?['active','','']:n===2?['done','active','']:['done','done','active'];
      ['d0','d1','d2'].forEach((id,i)=>document.getElementById(id).className='dot '+states[i]);
    }

    async function submitDonation(){
      const name=document.getElementById('name').value.trim();
      const message=document.getElementById('message').value.trim();
      const amount=parseFloat(document.getElementById('amount').value);
      const statusEl=document.getElementById('formStatus');
      const btn=document.getElementById('submitBtn');
      if(!name){statusEl.textContent='กรุณากรอกชื่อ';return;}
      if(!amount||amount<=0){statusEl.textContent='กรุณากรอกจำนวนเงิน';return;}
      statusEl.textContent='';btn.disabled=true;btn.textContent='กำลังส่ง...';
      try{
        const res=await fetch('/api/donate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({display_name:name,message,amount,sound_id:selectedSoundId,meme_id:selectedMemeId})});
        const data=await res.json();
        if(!res.ok) throw new Error(data.error||'เกิดข้อผิดพลาด');
        goTo(3);
        if(goalAmount>0) setTimeout(loadGoalStats, 1000);
      }catch(err){statusEl.textContent=err.message;}
      finally{btn.disabled=false;btn.textContent='ยืนยัน ✓';}
    }

    function resetAll(){
      document.getElementById('name').value='';
      document.getElementById('message').value='';
      document.getElementById('amount').value='';
      document.getElementById('formStatus').textContent='';
      selectedSoundId=null;
      selectedMemeId=null;
      updatePickers();
      goTo(1);
    }
  </script>
</body>
</html>
